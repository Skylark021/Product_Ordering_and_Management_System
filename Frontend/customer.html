<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Customer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Customer</h1>

  <section>
    <h2>Products</h2>
    <button onclick="loadProducts()">Refresh</button>
    <ul id="plist"></ul>
  </section>

  <section>
    <h2>Place Order</h2>
    <input id="oid" type="number" placeholder="product id">
    <input id="oqty" type="number" placeholder="quantity">
    <button onclick="order()">Order</button>
    <pre id="orderOut"></pre>
  </section>

  <section>
    <h2>Ordered Summary</h2>
    <button onclick="viewOrdered()">View</button>
    <ul id="olist"></ul>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
